# Default-branch workflow: regenerate the in-repo report and commit it back.
# Only this workflow needs contents: write.
name: Update Go Test Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go-test-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: test
        uses: soulteary/go-test-report-action@v1
        with:
          coverage_threshold: "80"
          report_output: ".github/go-test-report.md"
          badge_output: ".github/coverage.svg"
          json_output: ".github/go-test-report.json"
          commit: "true"
          commit_on_failure: "false"
